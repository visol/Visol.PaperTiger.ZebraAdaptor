Visol:
  PaperTiger:
    ZebraAdaptor:
      form:
        overrideRecipientAddress: ~
        allFormValues:
          excludeFieldNames: []
      # Registry mapping form-action NodeType names to handler services.
      # Domain packages contribute entries here; the generic FormApiController
      # dispatches via ObjectManager rather than hardcoding per-action injections.
      formActionHandlers: {}
      # Registry mapping form-field NodeType names to validator services
      # implementing Visol\PaperTiger\ZebraAdaptor\Contract\FormFieldValidatorInterface.
      # FormApiController runs each submitted field through its registered
      # validator before executing actions; non-empty error arrays short-circuit
      # the submission with HTTP 422 and surface inline in the frontend.
      formFieldValidators: {}
      # Field NodeType names grouped by the behaviour they trigger in the
      # generated schemas (ValidationSchema / TriggerSchema / ThresholdSchema).
      # Domain packages contribute their own field types here so this package
      # stays customer-agnostic. Keys are arbitrary labels and only need to be
      # unique across packages; the values are the NodeType names.
      fieldTypes:
        # Treated as e-mail inputs -> get the emailAddress validator.
        email:
          paperTigerEmail: 'Sitegeist.PaperTiger:Field.Email'
        # Multi-value fields -> their name attribute carries the [] suffix.
        multiValue:
          paperTigerCheckBoxes: 'Sitegeist.PaperTiger:Field.CheckBoxes'
        # Never receive validator / trigger / threshold configuration.
        omitted:
          paperTigerButton: 'Sitegeist.PaperTiger:Field.Button'
        # Additionally omitted from the threshold schema (non-text inputs).
        omittedFromThreshold:
          paperTigerCheckBoxes: 'Sitegeist.PaperTiger:Field.CheckBoxes'
          paperTigerRadioButtons: 'Sitegeist.PaperTiger:Field.RadioButtons'
          paperTigerDropdown: 'Sitegeist.PaperTiger:Field.Dropdown'
          paperTigerUpload: 'Sitegeist.PaperTiger:Field.Upload'
        # Which "this required field is empty" message a field type gets.
        # Domain packages assign their own field types to one of these
        # categories; anything unlisted falls back to form.fields.default.
        notEmptyMessage:
          # -> form.fields.radioButtons
          selectOption:
            paperTigerRadioButtons: 'Sitegeist.PaperTiger:Field.RadioButtons'
          # -> form.fields.checkboxes
          selectAtLeastOneOption:
            paperTigerCheckBoxes: 'Sitegeist.PaperTiger:Field.CheckBoxes'
          # -> form.fields.privacyConfirmation (consent checkboxes)
          acceptRequired: {}
          # -> form.fields.upload
          selectFile:
            paperTigerUpload: 'Sitegeist.PaperTiger:Field.Upload'
        # Client-side validation trigger events, keyed by event class.
        triggerEvents:
          keyup: {}
          blurAndInput:
            paperTigerEmail: 'Sitegeist.PaperTiger:Field.Email'
          change:
            paperTigerCheckBoxes: 'Sitegeist.PaperTiger:Field.CheckBoxes'
            paperTigerRadioButtons: 'Sitegeist.PaperTiger:Field.RadioButtons'
          changeAndBlur:
            paperTigerUpload: 'Sitegeist.PaperTiger:Field.Upload'
      # Field NodeType names (keys) whose presence in a form means the form
      # embeds server-computed data into the cached document. Only submissions of
      # such forms make the frontend revalidate the document cache, preventing
      # generic forms from being used as cache-busters. Domain packages register
      # their own types here (keeps this package customer-agnostic).
      documentRevalidatingFieldTypes: {}

Neos:
  Neos:
    fusion:
      autoInclude:
        Visol.PaperTiger.ZebraAdaptor: true
        Sitegeist.PaperTiger: false
        Neos.Fusion.Form: false
    userInterface:
      # Switch on to true to see all translated labels getting scrambled.
      # You then can localize everything that is still readable.
      scrambleTranslatedLabels: false
      translation:
        autoInclude:
          Visol.PaperTiger.ZebraAdaptor:
            - Main
            - 'NodeTypes/*'
  Flow:
    mvc:
      routes:
        'Visol.PaperTiger.ZebraAdaptor':
          position: 'before Neos.Neos'
    resource:
      collections:
        form:
          storage: 'defaultPersistentResourcesStorage'
          target: 'localWebDirectoryPersistentResourcesTarget'
