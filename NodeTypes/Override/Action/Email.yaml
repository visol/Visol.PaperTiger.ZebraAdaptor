Sitegeist.PaperTiger:Action.Email:
  label: "${(q(node).property('subject') ? 'Email: ' + q(node).property('subject') : 'Email')}"
  properties:
    'subject':
      type: string
      ui:
        label: i18n
        showInCreationDialog: true
        inspector:
          group: 'form'
          editorOptions:
            required: true
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': [ ]
    # The mail is always rendered as HTML; the plaintext part is generated from it
    # by Visol.PaperTiger.ZebraAdaptor:HtmlToTextProcessor, so the format selector
    # and the plaintext field are hidden.
    'format':
      defaultValue: html
      ui:
        inspector:
          group: ~
    'plaintext':
      ui:
        inspector:
          group: ~
    'html':
      # {allFormValues} renders a definition list of all submitted fields.
      defaultValue: '{allFormValues}'
      ui:
        label: 'Visol.PaperTiger.ZebraAdaptor:NodeTypes.PaperTiger.Action.Email:properties.html'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': [ ]
    'recipientAddress':
      ui:
        reloadIfChanged: true
        showInCreationDialog: true
        help:
          message: 'Visol.PaperTiger.ZebraAdaptor:NodeTypes.PaperTiger.Action.Email:properties.recipientAddress.help'
    'recipientName':
      ui:
        reloadIfChanged: true
        showInCreationDialog: true
        help:
          message: 'Visol.PaperTiger.ZebraAdaptor:NodeTypes.PaperTiger.Action.Email:properties.namePlaceholders.help'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': [ ]
    # No default sender address here: which address a site may send from is a
    # project decision (and often restricted by the mail relay). Projects set the
    # default - and mark the field readonly if only one address is authorised - in
    # their own NodeTypes override.
    'senderAddress':
      ui:
        reloadIfChanged: true
    'senderName':
      ui:
        reloadIfChanged: true
        showInCreationDialog: true
        help:
          message: 'Visol.PaperTiger.ZebraAdaptor:NodeTypes.PaperTiger.Action.Email:properties.namePlaceholders.help'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': [ ]
    'replyToAddress':
      ui:
        reloadIfChanged: true
        showInCreationDialog: true
        help:
          message: 'Visol.PaperTiger.ZebraAdaptor:NodeTypes.PaperTiger.Action.Email:properties.replyToAddress.help'
      validation:
        'Neos.Neos/Validation/NotEmptyValidator': [ ]
    'carbonCopyAddress':
      ui:
        reloadIfChanged: true
    'blindCarbonCopyAddress':
      ui:
        reloadIfChanged: true
    # Files an editor picks from the media browser, attached to every mail this
    # action sends - the information sheet or the form to fill in that a
    # confirmation mail is expected to carry. The uploads the visitor sent are a
    # separate switch ('attachUploads') on the same action.
    'attachments':
      type: array<Neos\Media\Domain\Model\Asset>
      ui:
        label: 'Visol.PaperTiger.ZebraAdaptor:NodeTypes.PaperTiger.Action.Email:properties.attachments'
        help:
          message: 'Visol.PaperTiger.ZebraAdaptor:NodeTypes.PaperTiger.Action.Email:properties.attachments.help'
        inspector:
          group: 'form'
    # Only meaningful in a Fusion-rendered setup, where it var_dumps the mail
    # instead of sending it. This package sends via FormApiController.
    'testMode':
      ui:
        inspector:
          group: ~
