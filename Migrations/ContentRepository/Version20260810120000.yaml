up:
  comments: >
    Field.Submit was a duplicate of the upstream Sitegeist.PaperTiger:Field.Button
    (which already renders as <button type="submit">), so it has been dropped.
    Action.DatabaseStorage was declared inside Sitegeist's namespace although it
    is defined by this package; it moves to the package's own namespace.
  migration:
    -
      filters:
        -
          type: 'NodeType'
          settings:
            nodeType: 'Sitegeist.PaperTiger:Field.Submit'
      transformations:
        -
          type: 'ChangeNodeType'
          settings:
            newType: 'Sitegeist.PaperTiger:Field.Button'
    -
      filters:
        -
          type: 'NodeType'
          settings:
            nodeType: 'Sitegeist.PaperTiger:Action.DatabaseStorage'
      transformations:
        -
          type: 'ChangeNodeType'
          settings:
            newType: 'Visol.PaperTiger.ZebraAdaptor:Action.DatabaseStorage'

down:
  comments: 'No down migration available'
